<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notekeeper</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header class="top">
        <button id="menuBtn" class="icon-btn" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
        <h1>Notekeeper</h1>
    </header>

    <div class="layout">
        <aside id="sidebar" aria-label="Notebook navigation">
            <div class="nb-row">
                <select id="notebookSelect" aria-label="Notebook"></select>
                <button id="notebookMore" class="icon-btn" title="Notebook actions" aria-label="Notebook actions">&#8943;</button>
            </div>
            <div class="side-actions">
                <button id="newPageBtn" class="btn primary">+ Page</button>
                <button id="newFolderBtn" class="btn">+ Folder</button>
                <button id="importBtn" class="btn" title="Load text, markdown, images or a backup">Import</button>
            </div>
            <input id="search" type="search" placeholder="Search pages" aria-label="Search pages">
            <nav id="tree" aria-label="Pages"></nav>
        </aside>

        <main id="main" tabindex="-1"></main>
    </div>

    <div id="dropOverlay" hidden><div id="dropText"></div></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <input id="fileInput" type="file" multiple hidden
           accept="image/*,.txt,.md,.markdown,.json,text/plain,text/markdown,application/json">

    <script src="js/db.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/importer.js"></script>
    <script src="js/ti-export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
